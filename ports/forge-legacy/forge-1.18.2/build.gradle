plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
    id 'com.github.johnrengelman.shadow'
}

ext.portMinecraftVersion = '1.18.2'
ext.portForgeVersion = '40.3.12'
ext.portForgeRange = '[40.3.0,41)'
ext.portLoaderRange = '[40,)'
ext.portJavaVersion = 17
ext.portPackFormat = 8
ext.sharedSourceExclusions = [
        'br/com/modtiktok/tiktokchaos/client/**',
        'br/com/modtiktok/tiktokchaos/gameplay/ActionExecutor.java',
        'br/com/modtiktok/tiktokchaos/gameplay/RandomActionTargets.java'
]
ext.adaptedSourceProject = ':forge-1.19.2'
ext.adaptedSourceExclusions = [
        'br/com/modtiktok/tiktokchaos/platform/forge/ForgeEntrypoint.java'
]
ext.adaptedSourceReplacements = [
        'Component.literal(': 'new net.minecraft.network.chat.TextComponent(',
        'Component.translatable(': 'new net.minecraft.network.chat.TranslatableComponent(',
        'performPrefixedCommand(': 'performCommand(',
        'Forge 1.19.2': 'Forge 1.18.2'
]

apply from: rootProject.file('forge-port.gradle')
