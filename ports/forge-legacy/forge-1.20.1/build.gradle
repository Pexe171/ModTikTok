plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle'
    id 'com.github.johnrengelman.shadow'
}

ext.portMinecraftVersion = '1.20.1'
ext.portForgeVersion = '47.4.23'
ext.portForgeRange = '[47.4.10,48)'
ext.portLoaderRange = '[47,)'
ext.portJavaVersion = 17
ext.portPackFormat = 15
ext.sharedSourceExclusions = []

apply from: rootProject.file('forge-port.gradle')
