pluginManagement {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        gradlePluginPortal()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'tiktok-chaos-forge-legacy'

include('forge-1.16.5', 'forge-1.18.2', 'forge-1.19.2', 'forge-1.20.1')
