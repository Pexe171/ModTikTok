plugins {
    id 'java-library'
    id 'net.minecraftforge.gradle' version '[7.0.3,8)'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'idea'
}

version = "${mod_version}+mc${minecraft_version}-forge"
group = mod_group_id

base {
    archivesName = 'tiktok-chaos'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: minecraft_version

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.enabledGameTestNamespaces', mod_id
        }

        register('client')
        register('gameTestServer')
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
    maven { url = 'https://jitpack.io' }
}

configurations {
    tiktokBundle
    compileOnly.extendsFrom(tiktokBundle)
}

def mergeTikTokRuntime = tasks.register('mergeTikTokRuntime', com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar) {
    archiveBaseName = 'tiktok-chaos-dev-tiktok-runtime'
    archiveClassifier = ''
    destinationDirectory = layout.buildDirectory.dir('dev-libs')
    configurations = [project.configurations.tiktokBundle]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST', 'module-info.class'
    mergeServiceFiles()
    manifest {
        attributes 'Automatic-Module-Name': 'tiktokchaos.tiktok.runtime'
    }
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    tiktokBundle("com.github.jwdeveloper.TikTok-Live-Java:Client:${tiktok_live_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.code.gson', module: 'gson'
    }
    runtimeOnly files(mergeTikTokRuntime.flatMap { it.archiveFile })

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets {
    main {
        java {
            srcDirs rootProject.file('src/main/java'), file('src/main/java')
            exclude 'br/com/modtiktok/tiktokchaos/platform/neoforge/**'
        }
        resources {
            srcDirs rootProject.file('src/main/resources'), layout.buildDirectory.dir('generated/sources/modMetadata')
        }
    }
    test {
        java.srcDir rootProject.file('src/test/java')
    }
}

// ForgeGradle's merged source-set mode does not automatically expose main output to tests.
sourceSets.test.compileClasspath += sourceSets.main.output
sourceSets.test.runtimeClasspath += sourceSets.main.output

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version_range: forge_version_range,
            forge_loader_version_range: forge_loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

tasks.named('processResources') {
    dependsOn generateModMetadata
}

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.tiktokBundle]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
    mergeServiceFiles()
    relocate 'io.github.jwdeveloper', 'br.com.modtiktok.tiktokchaos.shadow.jwdeveloper'
    relocate 'com.google.protobuf', 'br.com.modtiktok.tiktokchaos.shadow.protobuf'
    relocate 'org.java_websocket', 'br.com.modtiktok.tiktokchaos.shadow.websocket'
    manifest {
        attributes 'Implementation-Title': mod_name,
                'Implementation-Version': project.version
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
