plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'com.gradleup.shadow' version '9.6.1'
    id 'idea'
}

version = "${mod_version}+mc${minecraft_version}"
group = mod_group_id

base {
    archivesName = 'tiktok-chaos'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    maven { url = 'https://jitpack.io' }
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        gameTestServer {
            type = 'gameTestServer'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    tiktokBundle
    implementation.extendsFrom(tiktokBundle)
    additionalRuntimeClasspath.extendsFrom(tiktokBundle)
}

dependencies {
    tiktokBundle("com.github.jwdeveloper.TikTok-Live-Java:Client:${tiktok_live_version}") {
        exclude group: 'org.slf4j', module: 'slf4j-simple'
        exclude group: 'org.slf4j', module: 'slf4j-api'
        exclude group: 'com.google.code.gson', module: 'gson'
    }

    testImplementation platform('org.junit:junit-bom:5.13.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'com.google.code.gson:gson:2.10.1'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.main.resources {
    srcDir('src/generated/resources')
}

def generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version_range: neo_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.named('jar') {
    archiveClassifier = 'thin'
}

tasks.named('shadowJar') {
    archiveClassifier = ''
    configurations = [project.configurations.tiktokBundle]
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'META-INF/INDEX.LIST'
    mergeServiceFiles()
    relocate 'io.github.jwdeveloper', 'br.com.modtiktok.tiktokchaos.shadow.jwdeveloper'
    relocate 'com.google.protobuf', 'br.com.modtiktok.tiktokchaos.shadow.protobuf'
    relocate 'org.java_websocket', 'br.com.modtiktok.tiktokchaos.shadow.websocket'
    manifest {
        attributes 'Implementation-Title': mod_name,
                'Implementation-Version': project.version
    }
}

tasks.named('assemble') {
    dependsOn tasks.named('shadowJar')
}

tasks.named('build') {
    dependsOn tasks.named('shadowJar')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}

idea.module {
    downloadSources = true
    downloadJavadoc = true
}
