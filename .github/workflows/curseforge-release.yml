name: Publish to CurseForge

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_type:
        description: CurseForge release channel
        required: true
        default: release
        type: choice
        options:
          - release
          - beta
          - alpha
      display_name:
        description: Optional file display name
        required: false
        type: string
      existing_file_id:
        description: Optional CurseForge file ID to update instead of uploading
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-release
  cancel-in-progress: false

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    env:
      CURSEFORGE_API_TOKEN: ${{ secrets.CURSEFORGE_API_TOKEN }}
      # Accept the Project ID from Variables (recommended) or Secrets so a
      # harmless placement mistake does not block a release.
      CURSEFORGE_PROJECT_ID: ${{ vars.CURSEFORGE_PROJECT_ID || secrets.CURSEFORGE_PROJECT_ID }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate publishing configuration
        shell: bash
        run: |
          configuration_error=0
          if [[ -z "$CURSEFORGE_API_TOKEN" ]]; then
            echo "::error title=Missing CurseForge token::Create the Actions secret CURSEFORGE_API_TOKEN."
            configuration_error=1
          fi
          if [[ ! "$CURSEFORGE_PROJECT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Missing CurseForge Project ID::Create CURSEFORGE_PROJECT_ID as an Actions variable (recommended) or secret, using digits only."
            configuration_error=1
          fi
          if [[ "$configuration_error" -ne 0 ]]; then
            exit 1
          fi

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
            tag_version="${GITHUB_REF_NAME#v}"
            if [[ "$tag_version" != "$mod_version" ]]; then
              echo "Tag v${tag_version} does not match mod_version=${mod_version}" >&2
              exit 1
            fi
          fi

      - name: Build and test
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_file_id == '' }}
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon

      - name: Find distributable JAR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_file_id == '' }}
        id: artifact
        shell: bash
        run: |
          jar_path="$(find build/libs -maxdepth 1 -type f -name 'tiktok-chaos-*.jar' ! -name '*-thin.jar' -print -quit)"
          if [[ -z "$jar_path" ]]; then
            echo "Distributable JAR not found" >&2
            exit 1
          fi
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Keep a GitHub build artifact
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_file_id == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-chaos-${{ github.run_number }}
          path: ${{ steps.artifact.outputs.jar_path }}
          if-no-files-found: error

      - name: Upload file to CurseForge
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.existing_file_id == '' }}
        shell: bash
        env:
          REQUESTED_DISPLAY_NAME: ${{ inputs.display_name }}
          RELEASE_TYPE: ${{ github.event_name == 'workflow_dispatch' && inputs.release_type || 'release' }}
          JAR_PATH: ${{ steps.artifact.outputs.jar_path }}
        run: |
          report_api_error() {
            local context="$1"
            local http_code="$2"
            local response_file="$3"
            local message

            message="$(jq -r '.errorMessage // .message // .error // empty' "$response_file" 2>/dev/null || true)"
            if [[ -z "$message" ]]; then
              message="$(tr '\n' ' ' < "$response_file" | cut -c1-500)"
            fi
            if [[ -z "$message" ]]; then
              message="The API returned no response body."
            fi

            echo "::error title=CurseForge API error::${context} failed with HTTP ${http_code}: ${message}"
            exit 1
          }

          mod_version="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          display_name="$REQUESTED_DISPLAY_NAME"
          if [[ -z "$display_name" ]]; then
            display_name="TikTok Chaos ${mod_version} - NeoForge 1.21.1"
          fi

          versions_http_code="$(curl --silent --show-error \
            --output curseforge-versions.json \
            --write-out '%{http_code}' \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            "https://minecraft.curseforge.com/api/game/versions")"

          if [[ ! "$versions_http_code" =~ ^2[0-9][0-9]$ ]]; then
            report_api_error "Reading game versions" "$versions_http_code" curseforge-versions.json
          fi

          minecraft_version_id="$(jq -r '[.[] | select(.name == "1.21.1") | .id] | first // empty' curseforge-versions.json)"
          neoforge_version_id="$(jq -r '[.[] | select(.name == "NeoForge") | .id] | first // empty' curseforge-versions.json)"
          client_version_id="$(jq -r '[.[] | select(.name == "Client") | .id] | first // empty' curseforge-versions.json)"

          if [[ ! "$minecraft_version_id" =~ ^[0-9]+$ ]] || \
             [[ ! "$neoforge_version_id" =~ ^[0-9]+$ ]] || \
             [[ ! "$client_version_id" =~ ^[0-9]+$ ]]; then
            echo "::error title=CurseForge versions not found::Could not resolve 1.21.1, NeoForge, and Client to numeric game version IDs."
            exit 1
          fi

          game_version_ids="$(jq -n -c \
            --argjson minecraft "$minecraft_version_id" \
            --argjson neoforge "$neoforge_version_id" \
            --argjson client "$client_version_id" \
            '[$minecraft, $neoforge, $client] | unique')"

          echo "Resolved CurseForge game version IDs for Minecraft 1.21.1, NeoForge, and Client."

          jq -n \
            --rawfile changelog CHANGELOG.md \
            --arg displayName "$display_name" \
            --arg releaseType "$RELEASE_TYPE" \
            --argjson gameVersions "$game_version_ids" \
            '{
              changelog: $changelog,
              changelogType: "markdown",
              displayName: $displayName,
              gameVersions: $gameVersions,
              releaseType: $releaseType,
              isMarkedForManualRelease: false
            }' > curseforge-metadata.json

          metadata="$(jq -c . curseforge-metadata.json)"

          upload_http_code="$(curl --silent --show-error \
            --output curseforge-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            --form "file=@${JAR_PATH};type=application/java-archive" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/upload-file")"

          if [[ ! "$upload_http_code" =~ ^2[0-9][0-9]$ ]]; then
            report_api_error "Uploading the mod file" "$upload_http_code" curseforge-response.json
          fi

          file_id="$(jq -r '.id // empty' curseforge-response.json)"
          if [[ -z "$file_id" ]]; then
            echo "CurseForge did not return a file ID" >&2
            exit 1
          fi
          echo "Uploaded CurseForge file ID: $file_id"

      - name: Update existing CurseForge file
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.existing_file_id != '' }}
        shell: bash
        env:
          TARGET_FILE_ID: ${{ inputs.existing_file_id }}
          REQUESTED_DISPLAY_NAME: ${{ inputs.display_name }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          if [[ ! "$TARGET_FILE_ID" =~ ^[0-9]+$ ]]; then
            echo "::error title=Invalid CurseForge file ID::The existing_file_id input must contain digits only."
            exit 1
          fi

          if [[ -n "$REQUESTED_DISPLAY_NAME" ]]; then
            metadata="$(jq -n -c \
              --argjson fileID "$TARGET_FILE_ID" \
              --arg releaseType "$RELEASE_TYPE" \
              --arg displayName "$REQUESTED_DISPLAY_NAME" \
              '{fileID: $fileID, releaseType: $releaseType, displayName: $displayName}')"
          else
            metadata="$(jq -n -c \
              --argjson fileID "$TARGET_FILE_ID" \
              --arg releaseType "$RELEASE_TYPE" \
              '{fileID: $fileID, releaseType: $releaseType}')"
          fi

          update_http_code="$(curl --silent --show-error \
            --output curseforge-update-response.json \
            --write-out '%{http_code}' \
            --request POST \
            --header "X-Api-Token: ${CURSEFORGE_API_TOKEN}" \
            --form-string "metadata=${metadata}" \
            "https://minecraft.curseforge.com/api/projects/${CURSEFORGE_PROJECT_ID}/update-file")"

          if [[ ! "$update_http_code" =~ ^2[0-9][0-9]$ ]]; then
            message="$(jq -r '.errorMessage // .message // .error // empty' curseforge-update-response.json 2>/dev/null || true)"
            if [[ -z "$message" ]]; then
              message="$(tr '\n' ' ' < curseforge-update-response.json | cut -c1-500)"
            fi
            echo "::error title=CurseForge API error::Updating file ${TARGET_FILE_ID} failed with HTTP ${update_http_code}: ${message}"
            exit 1
          fi

          updated_file_id="$(jq -r '.id // empty' curseforge-update-response.json)"
          if [[ "$updated_file_id" != "$TARGET_FILE_ID" ]]; then
            echo "::error title=Unexpected CurseForge response::The API did not confirm file ${TARGET_FILE_ID}."
            exit 1
          fi

          echo "Updated CurseForge file ID ${updated_file_id} to release type ${RELEASE_TYPE}."
