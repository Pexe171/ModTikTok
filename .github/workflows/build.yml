name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Java 21 / NeoForge 1.21.1
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Test and build distributable JAR
        run: |
          chmod +x gradlew
          ./gradlew test shadowJar --no-daemon

      - name: Upload distributable JAR
        uses: actions/upload-artifact@v4
        with:
          name: tiktok-chaos-${{ github.sha }}
          path: |
            build/libs/tiktok-chaos-*.jar
            !build/libs/*-thin.jar
          if-no-files-found: error
          retention-days: 14
